# Shared TEI sidecars for pattern MCP servers.
#
# This stack owns the single pair of TEI containers (embedder + reranker)
# that both the architecture-pattern-mcp and agent-pattern-mcp systemd
# stacks consume via the external network `pattern-tei-shared`.
#
# Dev compose files (docker/docker-compose.yml in each repo) keep their
# OWN TEI sidecars with unique container names — they do NOT use this stack.
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#   # or via systemd: systemctl start pattern-tei-infra
#
# Image overrides (for registry-based deploys):
#   TEI_IMAGE=olkowa/pattern-tei-embed:0.1.0 TEI_RERANK_IMAGE=olkowa/pattern-tei-rerank:0.1.0 \
#     docker compose -f docker-compose.yml up -d

name: pattern-tei-infra

services:
  pattern-tei-embed:
    image: ${TEI_IMAGE:-pattern-tei-embed:latest}
    container_name: pattern-tei-embed
    restart: unless-stopped
    networks: [pattern-tei-shared]
    volumes:
      - tei-embed-data:/data
    environment:
      - HF_HUB_OFFLINE=1
      - HUGGINGFACE_HUB_CACHE=/data
      # TEI tunables — clap env fallbacks. Compose overrides Dockerfile ENV.
      # Invariant: EMBEDDER_BATCH_SIZE (client) ≤ MAX_CLIENT_BATCH_SIZE ≤ MAX_CONCURRENT_REQUESTS.
      - MAX_CONCURRENT_REQUESTS=${TEI_MAX_CONCURRENT_REQUESTS:-32}
      - MAX_BATCH_TOKENS=${TEI_MAX_BATCH_TOKENS:-8192}
      - MAX_CLIENT_BATCH_SIZE=${TEI_MAX_CLIENT_BATCH_SIZE:-32}
      - AUTO_TRUNCATE=${TEI_AUTO_TRUNCATE:-true}
      - PROMETHEUS_PORT=${TEI_PROMETHEUS_PORT:-0}
      - HOSTNAME=${TEI_HOSTNAME:-0.0.0.0}
      - PORT=${TEI_PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  pattern-tei-rerank:
    image: ${TEI_RERANK_IMAGE:-pattern-tei-rerank:latest}
    container_name: pattern-tei-rerank
    restart: unless-stopped
    networks: [pattern-tei-shared]
    volumes:
      - tei-rerank-data:/data
    environment:
      - HF_HUB_OFFLINE=1
      - HUGGINGFACE_HUB_CACHE=/data
      # TEI reranker tunables — clap env fallbacks. Compose overrides Dockerfile ENV.
      # Invariant: MAX_CLIENT_BATCH_SIZE must be ≥ bm25_top_k + dense_top_k
      # (up to 40 with RETRIEVAL_BM25_TOP_K=20 / RETRIEVAL_DENSE_TOP_K=20).
      # NOTE: PORT here must match the RERANKER_BASE_URL used by the MCP server
      # (compose env or config.json default: http://pattern-tei-rerank:8080).
      # If you change PORT, update those URLs accordingly.
      - MAX_CONCURRENT_REQUESTS=${TEI_RERANK_MAX_CONCURRENT_REQUESTS:-32}
      - MAX_BATCH_TOKENS=${TEI_RERANK_MAX_BATCH_TOKENS:-16384}
      - MAX_CLIENT_BATCH_SIZE=${TEI_RERANK_MAX_CLIENT_BATCH_SIZE:-48}
      - AUTO_TRUNCATE=${TEI_RERANK_AUTO_TRUNCATE:-true}
      - PROMETHEUS_PORT=${TEI_RERANK_PROMETHEUS_PORT:-0}
      - HOSTNAME=${TEI_RERANK_HOSTNAME:-0.0.0.0}
      - PORT=${TEI_RERANK_PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  pattern-tei-shared:
    name: pattern-tei-shared

volumes:
  tei-embed-data:
  tei-rerank-data:
